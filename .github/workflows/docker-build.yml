name: Docker Build

# Builds and pushes the MCP bridge image to Docker Hub.
#
# The Dockerfile builds FROM dhi.io/node:24 (Docker Hardened Images). Pulling
# those base layers requires a Docker Hub account with an active DHI subscription
# - the same DOCKER_HUB_USERNAME / DOCKER_HUB_ACCESS_TOKEN secrets the frontend
# CI uses. The single docker/login-action authorizes both the dhi.io base pulls
# and the push of markaspot/markaspot-mcp.
#
# Requires repo secrets: DOCKER_HUB_USERNAME, DOCKER_HUB_ACCESS_TOKEN.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: markaspot/markaspot-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single login authorizes both the dhi.io base-image pulls (DHI subscription)
      # and the push of the built image. Same secret convention as the frontend CI.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Tagging policy (mirrors markaspot-cloud's docker-image.yml):
      #   push main          -> :latest
      #   tag v1.2.3         -> :1.2.3 + :latest
      #   tag v1.2.3-rc.0    -> :1.2.3-rc.0 ONLY (pre-release never moves :latest)
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64
          cache-from: type=gha,scope=mcp-amd64
          cache-to: type=gha,scope=mcp-amd64,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build summary
        run: |
          echo "## MCP Bridge Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch/Tag:** ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Published tags:**" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "  - $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<'EOF'
          ${{ steps.meta.outputs.tags }}
          EOF
